    <meta property="og:title" content="V3M HR Office - Văn Phòng 3D & Quản Lý Nhân Sự" />
    <meta property="og:description" content="Văn phòng 3D isometric tương tác, trình chiếu tham quan khu, quản lý nhân sự, chấm công KPI, công việc và báo cáo vinh danh." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _origFetch;
            },
            set: function (fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (_) {}

        window.addEventListener('error', function (e) {
          if (
            (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var msg = e && e.reason && (e.reason.message || String(e.reason));
          if (
            msg &&
            (msg.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
